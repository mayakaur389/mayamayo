<!DOCTYPE html>
<html lang="hi">
<head>
  <title>Wrong Practice</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="main-container">Loading...</div>

  <script src="js/lessons.js"></script> 
  <script src="js/speaking.js"></script>
  
  <script>
    const practiceSet = JSON.parse(localStorage.getItem('practiceNowSet'));
    const mode = localStorage.getItem('practiceMode');
    
    if(!practiceSet || practiceSet.length === 0){ 
      document.getElementById('main-container').innerHTML = "<h2 style='text-align:center; margin-top:50px'>Koi galat question nahi hai</h2>";
    } else {
      localStorage.removeItem('practiceNowSet');
      localStorage.removeItem('practiceMode');

      if(mode === 'day_quiz'){
        // 1. LESSONS: lessons array ko replace karo
        window.lessons = [{ title: "❌ Galat Questions", day: 999, questions: practiceSet }];
        loadLesson(999); // agar tumhara function alag hai to naam change kar dena
      } 
      else if(mode === 'listening'){
        // 2. SUNO: gameData ko replace karke combo-game pe bhej do
        localStorage.setItem('practiceNowSet', JSON.stringify(practiceSet));
        window.location.href = 'combo-game.html?wrong=true';
      }
      else if(mode === 'speaking'){
        // 3. BOL KE: questions array ko replace karo
        window.questions = practiceSet;
        startSpeaking(); // agar tumhara function alag hai to naam change kar dena
      }
    }
    
    // JAB PRACTICE KHATAM HO TO YE CALL KARNA
    function finishWrongPractice(){
      alert("Wrong Practice Pura Hua!");
      let all = JSON.parse(localStorage.getItem('wrongQuestions'))||[];
      let filtered = all.filter(q=> q.type !== mode);
      localStorage.setItem('wrongQuestions', JSON.stringify(filtered));
      window.location.href = 'wrong-practice.html';
    }
  </script>
</body>
</html>
