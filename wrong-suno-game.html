<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galat - Suno aur Jodo</title>
<style>
  body{font-family:Arial;background:#0f0f1e;color:#fff;text-align:center;padding:15px;margin:0}
 .container{max-width:500px;margin:20px auto;background:#1e1e3a;padding:25px;border-radius:15px;box-shadow:0 0 20px #000}
  #question{font-size:22px;margin:20px 0;color:#ffd700;min-height:30px}
 .option-btn{display:block;width:90%;margin:12px auto;padding:14px;background:#2a2a4a;color:#fff;border:2px solid #444;border-radius:12px;font-size:18px;cursor:pointer}
 .option-btn:hover{background:#3a3a6a;border-color:#ffd700}
  #sunoBtn{padding:12px 28px;font-size:19px;background:#00c6ff;color:#fff;border:none;border-radius:25px;cursor:pointer;box-shadow:0 0 15px #00c6ff}
  #progress{color:#aaa}
</style>
</head>
<body>
<div class="container">
  <h2>❌ Galat Questions - Suno aur Jodo</h2>
  <p id="progress"></p>
  <h3 id="question"></h3>
  <button id="sunoBtn" onclick="speakCurrent()">🔊 Suno</button>
  <div id="options"></div>
  <p>Score: <span id="score">0</span>/<span id="total">0</span></p>
  <a href="wrong-practice.html" style="color:#aaa;">← Wapas</a>
</div>

<script>
function playCorrectSound(){ try{ new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg').play(); }catch(e){} }
function playWrongSound(){ try{ new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg').play(); }catch(e){} }

let practiceSet=[];
try{ practiceSet=JSON.parse(localStorage.getItem('practiceNowSet')||'[]'); }catch(e){ practiceSet=[]; }

if(!practiceSet.length){
  document.querySelector('.container').innerHTML="<h3>Koi data nahi!</h3><a href='wrong-practice.html'>Wapas</a>";
} else {

  // --- TUMHARE DATA KE HISAB SE MAPPING ---
  let gameData = practiceSet.map(q=>({
    english: q.audioText || q.english || q.q || "",
    hindi: q.correctHindi || q.hindi || q.ans || "",
    allOptions: q.allOptions || q.options || [] // isko expand karke dekho ek baar
  }));

  let cur=0, score=0;
  window.currentEng="";

  window.speakCurrent=function(){
    if(!gameData[cur]) return;
    let u=new SpeechSynthesisUtterance(gameData[cur].english);
    u.lang='en-US'; u.rate=0.9;
    speechSynthesis.speak(u);
  }

  function loadQuestion(){
    if(cur>=gameData.length){
      alert(`Khatam! Score ${score}/${gameData.length}`);
      localStorage.removeItem('practiceNowSet');
      let all=JSON.parse(localStorage.getItem('wrongQuestions')||'[]');
      all=all.filter(q=> (q.type||'').toLowerCase()!=='listening');
      localStorage.setItem('wrongQuestions',JSON.stringify(all));
      location.href='wrong-practice.html';
      return;
    }
    let q=gameData[cur];
    window.currentEng=q.english;
    document.getElementById('progress').innerText=`Question ${cur+1}/${gameData.length}`;
    document.getElementById('total').innerText=gameData.length;
    document.getElementById('score').innerText=score;
    document.getElementById('question').innerText=q.english;
    speakCurrent();

    let optionsDiv=document.getElementById('options');
    optionsDiv.innerHTML='';

    // Options banao
    let opts = [];
    if(q.allOptions && q.allOptions.length>0){
      opts = q.allOptions; // agar tumne options save kiye hain toh
    } else {
      // nahi toh dusre questions se uthao
      opts = gameData.map(x=>x.hindi).filter((v,i,a)=>a.indexOf(v)===i).sort(()=>0.5-Math.random()).slice(0,4);
      if(!opts.includes(q.hindi)){ opts[0]=q.hindi; }
    }
    opts = [...opts].sort(()=>0.5-Math.random());

    opts.forEach(hindiText=>{
      let btn=document.createElement('button');
      btn.className='option-btn';
      btn.innerText = typeof hindiText==='string'? hindiText : (hindiText.hindi || hindiText.correctHindi || hindiText);
      btn.onclick=()=>{
        let isCorrect = btn.innerText.trim().toLowerCase() === q.hindi.trim().toLowerCase();
        if(isCorrect){ score++; playCorrectSound(); } else { playWrongSound(); }
        cur++;
        setTimeout(loadQuestion, 700);
      };
      optionsDiv.appendChild(btn);
    });
  }
  loadQuestion();
}
</script>
</body>
</html>
