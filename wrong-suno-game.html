<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno - Galat Practice</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:20px;display:flex;justify-content:center;min-height:100vh}
.card{background:#1e293b;padding:25px;border-radius:20px;max-width:420px;width:100%;text-align:center;height:fit-content}
.sunoBtn{background:#06b6d4;color:#fff;border:none;padding:16px 40px;border-radius:50px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 0 25px #06b6d4;margin:20px 0}
.dropBox{min-height:60px;border:2px dashed #334155;border-radius:12px;margin:15px 0;display:flex;align-items:center;justify-content:center;background:#0f172a;font-weight:700;color:#94a3b8}
.optionsWrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px 0}
.chip{background:#334155;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;min-width:80px}
.chip:active{background:#3b82f6}
#feedback{padding:12px;border-radius:10px;margin-top:15px;display:none;font-weight:700}
.ok{background:#22c55e;color:#fff;display:block!important}.bad{background:#ef4444;color:#fff;display:block!important}
#nextBtn{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;margin-top:15px;font-weight:800;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0">❌ Galat Questions - Suno aur Jodo</h2>
<p id="qCount" style="color:#94a3b8">Question 1/3</p>
<button class="sunoBtn" id="sunoBtn">🔊 Suno</button>
<div class="dropBox" id="dropBox">Yahan jodo</div>
<div class="optionsWrap" id="optionsList"></div>
<div id="feedback"></div>
<button id="nextBtn">Next Question →</button>
<p style="margin-top:15px">Score: <span id="score">0/0</span></p>
<a href="wrong-practice.html" style="color:#94a3b8;text-decoration:none">← Wapas</a>
</div>

<script>
let set = [];
try{ set = JSON.parse(localStorage.getItem('practiceNowSet')||'[]'); }catch(e){}
if(!set.length){ try{ set = JSON.parse(localStorage.getItem('wrongQuestions')||'[]'); }catch(e){} }
console.log("LOADED SET:", set);

if(!set.length){
  document.body.innerHTML = "<h2 style='color:white;text-align:center'>Koi galat question nahi<br><a href='wrong-practice.html' style='color:#3b82f6'>Wapas Jao</a></h2>";
} else {
  // har type ke data ko samjhega
  let data = set.map(q=>{
    let ans = (q.answer || q.correct || q.correctAnswer || q.correctWord || q.audioText || q.word || "go").toString();
    let speakText = q.audioText || q.english || q.sentence || q.hindi || ans;
    let opts = q.options || q.choices || [];
    if(!opts.length){ opts = [ans, "going", "goes", "went"]; } // fallback options
    return { speakText, ans, opts };
  });

  let cur=0, score=0, selected=null;

  function speak(t){
    speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  function loadQ(){
    if(cur >= data.length){
      alert(`Khatam! Score ${score}/${data.length}`);
      localStorage.removeItem('practiceNowSet');
      location.href='wrong-practice.html';
      return;
    }
    let q = data[cur];
    selected=null;
    document.getElementById('qCount').innerText = `Question ${cur+1}/${data.length}`;
    document.getElementById('score').innerText = `${score}/${data.length}`;
    document.getElementById('dropBox').innerText = 'Yahan jodo';
    document.getElementById('dropBox').style.color = '#94a3b8';
    let fb=document.getElementById('feedback'); fb.style.display='none'; fb.className=''; fb.innerText='';

    // OPTIONS DIKHAO - YAHI TUMHARA MISSING THA
    let wrap=document.getElementById('optionsList');
    wrap.innerHTML='';
    let uniqueOpts = [...new Set([q.ans,...q.opts])].slice(0,4).sort(()=>0.5-Math.random());
    console.log("Options for Q",cur,uniqueOpts);
    uniqueOpts.forEach(optText=>{
      let btn=document.createElement('button');
      btn.className='chip';
      btn.innerText=optText;
      btn.onclick=()=>{
        selected=optText;
        let box=document.getElementById('dropBox');
        box.innerText=optText;
        box.style.color='#fff';
        checkAns();
      };
      wrap.appendChild(btn);
    });
  }

  function checkAns(){
    let q=data[cur];
    let fb=document.getElementById('feedback');
    fb.style.display='block';
    if(selected && selected.toLowerCase().trim() === q.ans.toLowerCase().trim()){
      fb.className='ok'; fb.innerText='✅ Sahi jawab!';
      if(fb.dataset.counted!=='1'){ score++; fb.dataset.counted='1'; document.getElementById('score').innerText=`${score}/${data.length}`; }
    }else{
      fb.className='bad'; fb.innerText=`❌ Galat! Sahi hai: ${q.ans}`;
    }
  }

  document.getElementById('sunoBtn').onclick=()=> speak(data[cur].speakText);
  document.getElementById('nextBtn').onclick=()=>{
    if(!selected){ alert('Pehle ek option chuno!'); return; }
    cur++; document.getElementById('feedback').dataset.counted=''; loadQ();
  };

  loadQ();
  setTimeout(()=>speak(data[0].speakText),500);
}
</script>
</body>
</html>
