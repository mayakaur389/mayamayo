<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galat - Sun Ke Jodo</title>
<style>
:root{--bg:#eef2ff;--card:#fff;--text:#1e293b;--opt:#e2e8f0}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#fff;--opt:#334155}
body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;display:flex;justify-content:center;min-height:100vh;padding:10px}
.app{background:var(--card);width:100%;max-width:430px;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.top{display:flex;justify-content:space-between;align-items:center}
.btn-small{border:1px solid #cbd5e1;background:var(--card);padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--text)}
.sub{text-align:center;color:#64748b;font-size:14px;margin:8px 0}
.stats{text-align:center;font-weight:700;margin:10px 0}
.sunoWrap{display:flex;justify-content:center;margin:16px 0}
.btn-suno{background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.optBtn{background:var(--opt);border:none;padding:16px 10px;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;color:var(--text)}
.optBtn.correct{background:#22c55e!important;color:#fff}
.optBtn.wrong{background:#ef4444!important;color:#fff}
.micWrap{display:flex;flex-direction:column;align-items:center;margin:20px 0}
.micBtn{width:72px;height:72px;border-radius:50%;background:#ef4444;border:none;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;color:#fff}
.micBtn.listening{background:#22c55e;transform:scale(1.1)}
#statusText{text-align:center;min-height:22px;font-weight:600;margin:10px 0;color:#64748b}
#nextBtn{width:100%;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-weight:800;display:none;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="btn-small" onclick="location.href='wrong-practice.html'">← Back</button><div style="font-weight:800">🎧 Galat - Suno</div><button class="btn-small" onclick="document.body.classList.toggle('dark')">🌙</button></div>
  <div class="sub">Maya bolegi, tum pehchano + bolo</div>
  <div class="stats" id="stats"></div>
  <div class="sunoWrap"><button class="btn-suno" id="sunoBtn">🔊 Suno</button></div>
  <div class="grid" id="optGrid"></div>
  <div id="statusText">Suno dabao</div>
  <div class="micWrap"><button class="micBtn" id="micBtn">🎙️</button><div style="font-size:12px;color:#64748b;margin-top:6px">Mic dabao aur English bolo</div></div>
  <button id="nextBtn">Next →</button>
</div>

<script>
// === UNIVERSAL FIX - KITNA BHI QUESTION ADD KARO, ROMAN DUPLICATE KHATAM ===
let MASTER_HINDI_MAP = {};
try{
  // Main game ke words se map banao agar wordData ho
  let wd = JSON.parse(localStorage.getItem('wordData')||'null');
  if(wd){
    Object.values(wd).forEach(v=>{
      if(Array.isArray(v)){
        v.forEach(it=>{ if(it.english && it.hindi) MASTER_HINDI_MAP[it.english.toLowerCase()]=it.hindi; });
      } else if(v && typeof v==='object'){
         Object.values(v).forEach(dayArr=>{
           if(Array.isArray(dayArr)) dayArr.forEach(it=>{ if(it.english && it.hindi) MASTER_HINDI_MAP[it.english.toLowerCase()]=it.hindi; });
         });
      }
    });
  }
}catch(e){}

// wrongQuestions se bhi seekho
try{
  let allWrong = JSON.parse(localStorage.getItem('wrongQuestions')||'[]');
  allWrong.forEach(q=>{
    if(q.english && (q.hindi||q.correctHindi)){
      MASTER_HINDI_MAP[q.english.toLowerCase().trim()] = q.hindi || q.correctHindi;
    }
    // agar hindi roman me save hai to uska english key se hindi map
    if(q.hindi) MASTER_HINDI_MAP[q.hindi.toLowerCase().trim()] = q.hindi;
  });
}catch(e){}

// Permanent backup - sabse common
Object.assign(MASTER_HINDI_MAP, {
  "namaste":"नमस्ते","alvida":"अलविदा","dhanyawad":"धन्यवाद","dhanyavaad":"धन्यवाद",
  "kripya":"कृपया","haan":"हाँ","nahi":"नहीं","somvaar":"सोमवार","mangalvaar":"मंगलवार",
  "budhvaar":"बुधवार","guruwar":"गुरुवार","shukravaar":"शुक्रवार","shanivaar":"शनिवार",
  "ravivaar":"रविवार","pila":"पीला","peela":"पीला","laal":"लाल","hara":"हरा",
  "neela":"नीला","kala":"काला","safed":"सफ़ेद","narangi":"नारंगी","gulabi":"गुलाबी"
});

function isRoman(str){
  return /^[A-Za-z\s]+$/.test(str.trim()) && str.trim().length>0;
}
function cleanOptions(options){
  let converted = options.map(o=>{
    if(!o) return o;
    let k = o.toString().trim();
    let low = k.toLowerCase();
    // Roman hai to Hindi me badlo
    if(isRoman(k)){
      return MASTER_HINDI_MAP[low] || k;
    }
    // Agar Devanagari map me uska Roman roop hai to bhi convert (duplicate case)
    // jaise "pila" aur "पीला" dono aaye to ek hi ban jayega
    return MASTER_HINDI_MAP[low] || k;
  });
  return [...new Set(converted)];
}
function toDevanagariSingle(text){
  if(!text) return text;
  let low = text.toString().toLowerCase().trim();
  return MASTER_HINDI_MAP[low] || text;
}
// === FIX END ===

let wrongSet=[];
try{ wrongSet=JSON.parse(localStorage.getItem('practiceNowSet')||'[]'); }catch(e){}
if(!wrongSet.length){ try{ wrongSet=JSON.parse(localStorage.getItem('wrongQuestions')||'[]'); }catch(e){} }
wrongSet = wrongSet.filter(q=>{ let t=(q.type||'').toLowerCase(); return t.includes('listen') || q.audioText || q.english; });

if(!wrongSet.length){
  document.getElementById('optGrid').innerHTML="<p style='grid-column:1/3;text-align:center'>Koi galat nahi hai</p>";
}else{
  let cur=0,score=0,hindiOK=false;
  const statsEl=document.getElementById('stats'), statusEl=document.getElementById('statusText'), gridEl=document.getElementById('optGrid'), nextBtn=document.getElementById('nextBtn'), sunoBtn=document.getElementById('sunoBtn'), micBtn=document.getElementById('micBtn');

  function updateStats(){ statsEl.innerText=`Question: ${cur+1}/${wrongSet.length} | Score: ${score}/${wrongSet.length}`; }
  function speak(text){
    if(!text) return;
    window.speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9;
    u.onstart=()=>statusEl.innerText=`🔊 ${text}`;
    u.onend=()=>{ if(!hindiOK) statusEl.innerText="Sahi Hindi chuno"; };
    window.speechSynthesis.speak(u);
  }

  function loadQ(){
    if(cur>=wrongSet.length){ localStorage.removeItem('practiceNowSet'); alert(`Khatam! ${score}/${wrongSet.length}`); location.href='wrong-practice.html'; return; }
    hindiOK=false; nextBtn.style.display='none'; micBtn.classList.remove('listening');
    let q=wrongSet[cur]; updateStats();

    let english = q.english || q.audioText || q.title || "";
    let correctHindi = toDevanagariSingle(q.hindi || q.correctHindi || "");

    let rawOptions = (q.options || []).map(o => {
      if(typeof o === 'string') return o;
      if(o && o.hindi) return o.hindi;
      if(o && typeof o === 'object') return o.hindi || "";
      return "";
    }).filter(Boolean);

    rawOptions = cleanOptions(rawOptions);
    let backup = ["नमस्ते","अलविदा","धन्यवाद","कृपया","हाँ","नहीं","पीला","लाल","हरा","नीला"];
    let otherHindis = wrongSet.map(x=> toDevanagariSingle(x.hindi||x.correctHindi) ).filter(h=>h && h!==correctHindi);
    let pool = cleanOptions([...rawOptions,...otherHindis,...backup]);

    let finalOptions = [correctHindi];
    for(let p of pool){
      if(finalOptions.length>=4) break;
      if(!finalOptions.includes(p)) finalOptions.push(p);
    }
    while(finalOptions.length<4){
      let b = backup[finalOptions.length % backup.length];
      if(!finalOptions.includes(b)) finalOptions.push(b);
      else finalOptions.push("सुप्रभात");
      finalOptions=[...new Set(finalOptions)];
    }
    let options = finalOptions.slice(0,4).sort(()=>0.5-Math.random());

    gridEl.innerHTML='';
    options.forEach(opt=>{
      let b=document.createElement('button'); b.className='optBtn'; b.innerText=opt;
      b.onclick=()=>{
        if(hindiOK) return;
        if(opt===correctHindi){
          b.classList.add('correct'); hindiOK=true;
          statusEl.innerText=`✅ Sahi! Mic dabao aur bolo: "${english}"`;
          speak(english);
        }else{
          b.classList.add('wrong');
          statusEl.innerText=`❌ Galat! Sahi hai: ${correctHindi}`;
        }
      };
      gridEl.appendChild(b);
    });
    statusEl.innerText="🔊 Suno dabao";
    setTimeout(()=>speak(english),400);
  }

  sunoBtn.onclick=()=>{ let q=wrongSet[cur]; speak(q.english || q.audioText || ""); };

  let recognition;
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR(); recognition.lang='en-US';
    recognition.onstart=()=>{ micBtn.classList.add('listening'); statusEl.innerText="🎧 Sun raha hu..."; };
    recognition.onend=()=>micBtn.classList.remove('listening');
    recognition.onresult=(e)=>{
      let said=e.results[0][0].transcript;
      score++; updateStats();
      statusEl.innerText=`✅ Bola: "${said}"`;
      nextBtn.style.display='block';
    };
    recognition.onerror=()=>{ micBtn.classList.remove('listening'); statusEl.innerText="Mic error, fir se try karo"; };
  }

  micBtn.onclick=()=>{
    if(!hindiOK){ alert('Pehle sahi Hindi chuno'); return; }
    if(!recognition){ score++; updateStats(); nextBtn.style.display='block'; return; }
    try{ recognition.start(); }catch{ recognition.stop(); setTimeout(()=>recognition.start(),200); }
  };

  nextBtn.onclick=()=>{ cur++; loadQ(); };
  loadQ();
}
</script>
</body>
</html>
