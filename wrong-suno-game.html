<!DOCTYPE html>
<html lang="hi">
<head>
  <title>❌ Galat - Suno aur Jodo</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- combo-game.html ka body yaha paste kar do -->
  <div class="container">
    <h2>❌ Galat Questions - Suno aur Jodo</h2>
    <p id="progress"></p>
    <p id="question"></p>
    <button id="sunoBtn">🔊 Suno</button>
    <div id="options"></div>
    <p>Score: <span id="score">0</span>/<span id="total">0</span></p>
  </div>

  <script src="js/sounds.js"></script>
  <script>
    // SEEDHA GALAT WALE UTHAO
    const practiceSet = JSON.parse(localStorage.getItem('practiceNowSet'));
    localStorage.removeItem('practiceNowSet');

    let gameData = practiceSet.map(q => ({
      english: q.english || q.q,
      hindi: q.hindi || q.ans,
      options: q.options || []
    }));

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion(){
      if(currentQuestion >= gameData.length){
        alert("Wrong Practice Khatam!");
        // galat list se hata do
        let all = JSON.parse(localStorage.getItem('wrongQuestions'))||[];
        all = all.filter(q=> q.type!== 'listening');
        localStorage.setItem('wrongQuestions', JSON.stringify(all));
        window.location.href = 'wrong-practice.html';
        return;
      }

      let q = gameData[currentQuestion];
      document.getElementById('progress').innerText = `Question ${currentQuestion+1}/${gameData.length}`;
      document.getElementById('total').innerText = gameData.length;
      document.getElementById('question').innerText = q.english;
      speak(q.english); // sound

      // options
      let optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      q.options.sort(()=>Math.random()-0.5);
      q.options.forEach(opt => {
        let btn = document.createElement('button');
        btn.innerText = opt.hindi;
        btn.onclick = () => {
          if(opt.english === q.english) score++;
          document.getElementById('score').innerText = score;
          currentQuestion++;
          setTimeout(loadQuestion, 600);
        }
        optionsDiv.appendChild(btn);
      });
    }
    loadQuestion();
  </script>
</body>
</html>
