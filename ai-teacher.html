<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya Didi - AI Teacher</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }

    /* ✅ Header Left me - Beech se hata diya */
  .header { background: #1e293b; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #3b82f6; }
  .header h2 { margin: 0; color: #3b82f6; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .header p { margin: 0; font-size: 12px; color: #22c55e; }
  .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-left: 5px; }

    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
  .user { background: #3b82f6; align-self: flex-end; }
  .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }

    /* ✅ Mic button add kiya */
  .input-area { display: flex; padding: 15px; background: #1e293b; border-top: 2px solid #334155; gap: 10px; align-items: center; }
    #userInput { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 16px; outline: none; }
    button { padding: 12px 16px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:active { background: #2563eb; }
    #micBtn { background: #ef4444; padding: 12px 14px; }
    #micBtn.listening { background: #22c55e; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
  </style>
</head>
<body>

  <!-- ✅ Left Side Header -->
  <div class="header">
    <h2>👩‍🏫 Maya Didi <span class="dot"></span></h2>
    <p id="status">online</p>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Maya se kuch pucho ya Mic dabao...">
    <button id="micBtn" onclick="startMic()">🎤</button>
    <button onclick="sendMsg()">Bhej</button>
  </div>

<script>
const API_URL = "/api/chat";
let chatHistory = [];

// ✅ Chat Save - Refresh pe delete nahi hogi
function saveChat() {
  localStorage.setItem('mayaChat', JSON.stringify(chatHistory));
}
function loadChat() {
  const saved = localStorage.getItem('mayaChat');
  if (saved) {
    chatHistory = JSON.parse(saved);
    chatHistory.forEach(msg => {
      addMsg(msg.content, msg.role === 'user'? 'user' : 'bot', false);
    });
  } else {
    addMsg("Namaste 🙏 Main Maya Didi hu. English seekhni hai? Koi bhi sawal pucho.", 'bot', false);
  }
}

function addMsg(text, sender, shouldSave = true){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (shouldSave) {
    chatHistory.push({role: sender === 'user'? 'user' : 'assistant', content: text});
    saveChat();
  }
}

async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, 'user');
  input.value = '';
  document.getElementById('status').innerText = 'typing...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });

    const data = await res.json();
    const reply = data.reply || "Sorry, jawab nahi mila.";
    addMsg(reply, 'bot');
    document.getElementById('status').innerText = 'online';

  } catch(e){
    console.error("API Error:", e);
    addMsg("Maya so rahi hai bhai 😅. GROQ_API_KEY check kar ya API down hai.", 'bot');
    document.getElementById('status').innerText = 'online';
  }
}

// ✅ Mic wala function
function startMic() {
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Tera browser Mic support nahi karta Guru. Chrome use kar.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.continuous = false;

  recognition.onstart = () => {
    micBtn.classList.add('listening');
    document.getElementById('status').innerText = 'sun rahi hu...';
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById('userInput').value = text;
    sendMsg();
  };

  recognition.onend = () => {
    micBtn.classList.remove('listening');
    document.getElementById('status').innerText = 'online';
  };

  recognition.start();
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') sendMsg();
});

// ✅ Page load pe chat wapas lao
loadChat();
</script>

</body>
</html>
