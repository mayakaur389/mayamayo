<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya Didi Chat</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#0b141a;color:#fff;max-width:600px;margin:auto;height:100vh}
    #chat-page{height:100vh;display:flex;flex-direction:column}
    .chat-header{background:#075e54;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .chat-box{flex:1;padding:10px;overflow-y:auto;background:#0b141a;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231a2a33' fill-opacity='0.2'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
    .input-area{display:flex;padding:8px;background:#1f2c33;gap:8px;align-items:center}
    input{flex:1;padding:12px 15px;border:none;background:#2a3942;color:#e9edef;border-radius:8px;font-size:15px;outline:none;direction:ltr !important;text-align:left !important;unicode-bidi:normal !important}
    button{padding:12px 16px;border:none;background:#00a884;color:#fff;cursor:pointer;border-radius:8px;font-weight:600}
    .msg{margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;position:relative;clear:both}
    .user-msg{background:#005c4b;color:#e9edef;margin-left:auto;border-radius:7.5px 0 7.5px 7.5px;float:right}
    .ai-msg{background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left}
    .quick-replies{margin:8px 0;display:flex;gap:6px;clear:both}
    .quick-replies button{margin:0;padding:6px 12px;background:#2a3942;border:none;color:white;border-radius:16px;cursor:pointer;font-size:13px}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:999}
    .modal-content{background:#222;padding:20px;border-radius:8px;width:300px;text-align:center}
    .theme-btn{cursor:pointer;font-size:18px}
  </style>
</head>
<body>
  <div id="chat-page">
    <div class="chat-header">
      <span>Maya Didi 👩‍🏫</span>
      <span>
        <span class="theme-btn" onclick="location.href='index.html'">🏠</span>
        <span class="theme-btn" id="themeToggle">🌙</span>
      </span>
    </div>
    <div class="chat-box" id="chat-box">
      <div class="msg ai-msg">Namaste! Main Maya Didi hun. English sikhe? 🙋‍♀️</div>
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Message" onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Bhejo</button>
    </div>
  </div>

  <div id="api-modal" class="modal">
    <div class="modal-content">
      <h3>🔑 Groq API Key Daalo</h3>
      <input type="text" id="api-key-input" placeholder="gsk_xxxxx..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;margin:10px 0;">
      <button onclick="saveApiKey()" style="background:#00a884;color:white;padding:12px;border:none;border-radius:8px;width:100%;">Save & Chat Karo</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      if (!localStorage.getItem('groq_api_key')) {
        document.getElementById('api-modal').style.display = 'flex';
      }
      const themeToggle = document.getElementById('themeToggle');
      if(localStorage.getItem('theme') === 'dark') {
        document.body.style.background = '#0b141a';
        themeToggle.innerText = '☀️';
      }
      themeToggle.onclick = () => {
        if(document.body.style.background === 'rgb(11, 20, 26)') {
          document.body.style.background = '#fff';
          document.body.style.color = '#000';
          themeToggle.innerText = '🌙';
          localStorage.setItem('theme', 'light');
        } else {
          document.body.style.background = '#0b141a';
          document.body.style.color = '#fff';
          themeToggle.innerText = '☀️';
          localStorage.setItem('theme', 'dark');
        }
      };
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('groq_api_key', key);
        document.getElementById('api-modal').style.display = 'none';
      }
    }

    async function sendMsg() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg) return;

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="msg user-msg">${msg}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: msg })
        });

        const data = await res.json();
        const reply = data.reply || data.error;
        chatBox.innerHTML += `<div class="msg ai-msg">${reply}</div>`;
        chatBox.innerHTML += `
          <div class="quick-replies">
            <button onclick="quickReply('Haan')">Haan</button>
            <button onclick="quickReply('Nahi')">Nahi</button>
          </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch(e) {
        chatBox.innerHTML += `<div class="msg ai-msg">Error: Maya abhi busy hai, baad me try karo</div>`;
      }
    }

    function quickReply(text) {
      document.getElementById('user-input').value = text;
      sendMsg();
    }
  </script>
</body>
</html>
