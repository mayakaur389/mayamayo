<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Didi Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0c1317;color:#e9edef;max-width:600px;margin:auto;height:100vh;overflow:hidden}

#chat-page{height:100vh;display:flex;flex-direction:column}
.chat-header{background:#202c33;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:#e9edef;border-bottom:1px solid #2a3942}
.theme-btn{cursor:pointer;margin-left:12px;font-size:18px}

.chat-box{flex:1;padding:12px;overflow-y:auto;background:#0c1317;background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a2c38' fill-opacity='0.15'%3E%3Cpath d='M0 20L20 0l20 20L20 40z'/%3E%3C/g%3E%3C/svg%3E");}

.input-area{display:flex;align-items:center;gap:8px;padding:10px;background:#202c33;border-top:1px solid #2a3942}
#chat-input{flex:1;height:42px;border-radius:20px;border:none;padding:0 15px;font-size:15px;background:#2a3942;color:#e9edef;outline:none;direction:ltr !important;text-align:left !important;unicode-bidi:normal !important}
#mic-btn{width:42px;height:42px;border-radius:50%;border:none;background:#e63946;color:white;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#send-btn{width:42px;height:42px;border-radius:50%;border:none;background:#00a884;color:white;cursor:pointer;flex-shrink:0;font-size:18px;display:flex;align-items:center;justify-content:center}

/* WhatsApp Style Messages */
.msg{margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;clear:both;direction:ltr;text-align:left}

.user-msg{background:#005c4b;color:#e9edef;margin-left:auto;border-radius:7.5px 0 7.5px 7.5px;float:right;direction:ltr;text-align:left}

.ai-msg{background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;direction:ltr;text-align:left}

.quick-replies{display:flex;gap:6px;margin:8px 0;clear:both}
.quick-replies button{background:#202c33;color:#e9edef;border:1px solid #2a3942;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}

/* API Key Modal */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:999}
.modal-content{background:#202c33;padding:20px;border-radius:12px;width:90%;max-width:400px;color:#e9edef}
</style>
</head>
<body>
<div id="chat-page">
  <div class="chat-header">
    <span>Maya Didi 👩‍🏫</span>
    <span>
      <span class="theme-btn" onclick="location.href='index.html'">🏠</span>
      <span class="theme-btn" id="themeToggle">🌙</span>
    </span>
  </div>
  <div class="chat-box" id="chat-box">
    <div class="msg ai-msg">Namaste! Main Maya Didi hun. English sikhe? 🙋‍♀️</div>
  </div>
  <div class="input-area">
    <input type="text" id="chat-input" placeholder="Maya se pucho..." autocomplete="off" dir="ltr">
    <button id="mic-btn">🎤</button>
    <button id="send-btn">➤</button>
  </div>
</div>

<div id="api-modal" class="modal">
  <div class="modal-content">
    <h3>🔑 Groq API Key Daalo</h3>
    <input type="text" id="api-key-input" placeholder="gsk_xxxxx..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;margin:10px 0;">
    <button onclick="saveApiKey()" style="background:#00a884;color:white;padding:12px;border:none;border-radius:8px;width:100%;">Save & Chat Karo</button>
  </div>
</div>

<script>
window.onload = function() {
  if (!localStorage.getItem('groq_api_key')) {
    document.getElementById('api-modal').style.display = 'flex';
  }
  const themeToggle = document.getElementById('themeToggle');
  if(localStorage.getItem('theme') === 'dark') {
    document.body.style.background = '#0b141a';
    themeToggle.innerText = '☀️';
  }
  themeToggle.onclick = () => {
    if(document.body.style.background === 'rgb(11, 20, 26)') {
      document.body.style.background = '#fff';
      document.body.style.color = '#000';
      themeToggle.innerText = '🌙';
      localStorage.setItem('theme', 'light');
    } else {
      document.body.style.background = '#0b141a';
      document.body.style.color = '#fff';
      themeToggle.innerText = '☀️';
      localStorage.setItem('theme', 'dark');
    }
  };

  // Enter se send
  document.getElementById('chat-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      sendMsg();
    }
  });
  // Send button
  document.getElementById('send-btn').onclick = sendMsg;
}

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (key) {
    localStorage.setItem('groq_api_key', key);
    document.getElementById('api-modal').style.display = 'none';
  }
}

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  const chatBox = document.getElementById('chat-box');
  chatBox.innerHTML += `<div class="msg user-msg">${msg}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: msg })
    });
    const data = await res.json();
    const reply = data.reply || data.error || "Maya Didi abhi busy hai 😅";
    
    chatBox.innerHTML += `<div class="msg ai-msg">${reply}</div>`;
    chatBox.innerHTML += `<div class="quick-replies">
      <button onclick="quickReply('Haan')">Haan</button>
      <button onclick="quickReply('Nahi')">Nahi</button>
    </div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch(e) {
    chatBox.innerHTML += `<div class="msg ai-msg">Error: Maya abhi busy hai, baad me try karo</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

function quickReply(text) {
  document.getElementById('chat-input').value = text;
  sendMsg();
}
</script>
</body>
</html>
