<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya Didi - AI Teacher</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
   .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #3b82f6; }
   .header h2 { margin: 0; color: #3b82f6; }
   .header p { margin: 5px 0 0; font-size: 14px; color: #94a3b8; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
   .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
   .user { background: #3b82f6; align-self: flex-end; }
   .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
   .input-area { display: flex; padding: 15px; background: #1e293b; border-top: 2px solid #334155; gap: 10px; }
    #userInput { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 16px; outline: none; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h2>👩‍🏫 Maya Didi</h2>
    <p id="status">online</p>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Maya se kuch pucho...">
    <button onclick="sendMsg()">Bhej</button>
  </div>

<script>
// ✅✅ YE WALA ROOT SAHI HAI GURU - .js mat lagana
const API_URL = "/api/chat"; 

let chatHistory = [];
addMsg("Namaste 🙏 Main Maya Didi hu. English seekhni hai? Koi bhi sawal pucho.", 'bot');

function addMsg(text, sender){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, 'user');
  input.value = '';
  document.getElementById('status').innerText = 'typing...';
  chatHistory.push({role: "user", content: text});

  try {
    const res = await fetch(API_URL, { // ✅ /api/chat pe request jayegi
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });

    const data = await res.json();
    const reply = data.reply || "Sorry, jawab nahi mila.";
    addMsg(reply, 'bot');
    chatHistory.push({role: "assistant", content: reply});
    document.getElementById('status').innerText = 'online';

  } catch(e){
    console.error("API Error:", e);
    // ✅ Ab GROQ ka error aayega, OPENROUTER nahi
    addMsg("Maya so rahi hai bhai 😅. `GROQ_API_KEY` Vercel me check kar le ya API down hai.", 'bot');
    document.getElementById('status').innerText = 'online';
  }
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') sendMsg();
});
</script>

</body>
</html>
