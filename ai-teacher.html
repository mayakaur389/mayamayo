<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mayamayo - Maya Didi</title>
</head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0c1317;color:#e9edef;max-width:600px;margin:auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden">

<div style="background:#0c1317;padding:15px;text-align:center;border-bottom:1px solid #2a3942;position:relative;flex-shrink:0">
  <a href="/" style="position:absolute;left:15px;top:15px;font-size:20px;text-decoration:none;color:#e9edef">←</a>
  <h1 style="margin:0;font-size:22px;color:#00a884">Mayamayo</h1>
</div>

<div style="background:#202c33;padding:12px 16px;font-weight:600;color:#e9edef;border-bottom:1px solid #2a3942;flex-shrink:0">Maya Didi 👩‍🏫</div>
  
<div id="chat-box" style="flex:1;overflow-y:auto;padding:12px;background:#0c1317">
  <div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;clear:both;direction:ltr;text-align:left">Namaste! Main Maya Didi hun. English sikhe? 🙋‍♀️</div>
</div>
  
<div style="display:flex;align-items:center;gap:8px;padding:10px;background:#202c33;border-top:1px solid #2a3942;flex-shrink:0">
  <input type="text" id="chat-input" placeholder="Maya se pucho..." autocomplete="off" 
    style="flex:1;height:42px;border-radius:20px;border:1px solid #2a3942;padding:0 15px;font-size:16px;background:#2a3942;color:#fff;outline:none;direction:ltr;text-align:left">
  <button id="send-btn" style="width:42px;height:42px;border-radius:50%;border:none;background:#00a884;color:white;cursor:pointer;font-size:18px">➤</button>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('chat-input');
document.getElementById('send-btn').onclick = sendMsg;
input.addEventListener('keypress', e => { if(e.key==='Enter') sendMsg(); });

async function sendMsg() {
  const msg = input.value.trim();
  if(!msg) return;
  chatBox.innerHTML += `<div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;background:#005c4b;color:#fff;margin-left:auto;border-radius:7.5px 0 7.5px 7.5px;float:right;clear:both;direction:ltr;text-align:left">${msg}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({prompt: msg})
  });
  const data = await res.json();
  const reply = data.reply || "Maya Didi abhi busy hai 😅";
  chatBox.innerHTML += `<div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;clear:both;direction:ltr;text-align:left">${reply}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
