<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mayamayo - Maya Didi</title>
</head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0c1317;color:#e9edef;max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden">

<div style="background:#0c1317;padding:15px;text-align:center;border-bottom:1px solid #2a3942;position:relative;flex-shrink:0">
  <a href="/" style="position:absolute;left:15px;top:15px;font-size:20px;text-decoration:none;color:#e9edef">←</a>
  <h1 style="margin:0;font-size:22px;color:#00a884">Mayamayo</h1>
</div>

<div style="background:#202c33;padding:12px 16px;font-weight:600;color:#e9edef;border-bottom:1px solid #2a3942;flex-shrink:0">Maya Didi 👩‍🏫</div>
  
<div id="chat-box" style="flex:1;padding:12px;overflow-y:auto;background:#0c1317;min-height:200px">
  <div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;clear:both;background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;direction:ltr;text-align:left">Namaste! Main Maya Didi hun. English sikhe? 🙋‍♀️</div>
</div>
  
<div style="display:flex;align-items:center;gap:8px;padding:10px;background:#202c33;border-top:1px solid #2a3942;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))">
  <input type="text" id="chat-input" placeholder="Maya se pucho..." autocomplete="off" 
    style="flex:1;height:42px;border-radius:20px;border:1px solid #2a3942;padding:0 15px;font-size:15px;background:#2a3942 !important;color:#ffffff !important;outline:none;caret-color:#ffffff;direction:ltr !important;text-align:left !important;unicode-bidi:plaintext !important" 
    inputmode="text">
  <button id="send-btn" style="width:42px;height:42px;border-radius:50%;border:none;background:#00a884;color:white;cursor:pointer;flex-shrink:0;font-size:18px;display:flex;align-items:center;justify-content:center">➤</button>
</div>

<script>
document.getElementById('send-btn').onclick = sendMsg;
document.getElementById('chat-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') { sendMsg(); }
});

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  const chatBox = document.getElementById('chat-box');
  chatBox.innerHTML += `<div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;clear:both;background:#005c4b;color:#ffffff;margin-left:auto;border-radius:7.5px 0 7.5px 7.5px;float:right;direction:ltr;text-align:left">${msg}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: msg })
    });
    const data = await res.json();
    const reply = data.reply || data.error || "Maya Didi abhi busy hai 😅";
    
    chatBox.innerHTML += `<div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;clear:both;background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;direction:ltr;text-align:left">${reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch(e) {
    chatBox.innerHTML += `<div style="margin:6px 0;padding:8px 12px;border-radius:7.5px;max-width:75%;word-wrap:break-word;line-height:1.4;font-size:14.5px;clear:both;background:#202c33;color:#e9edef;border-radius:0 7.5px 7.5px 7.5px;float:left;direction:ltr;text-align:left">Error: Maya abhi busy hai</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}
</script>
</body>
</html>
