<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Didi</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:#000;color:white;min-height:100vh;max-width:600px;margin:auto}
  
  /* Dashboard CSS */
  .header{background:#2196F3;padding:16px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:24px;font-weight:700}
  .header-icons{display:flex;gap:12px;font-size:18px;align-items:center}
  .container{padding:20px;background:#000}
  .btn{width:100%;padding:16px;margin-bottom:15px;border:none;border-radius:12px;font-size:16px;font-weight:600;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
  .btn-purple{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
  .btn-red{background:#ef4444}
  .btn-orange{background:#f97316}
  .btn-green{background:#10b981}
  .hidden{display:none}
  
  /* Chat UI CSS - Wahi Purana */
  .chat-header{background:#075e54;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .chat-header img{width:40px;height:40px;border-radius:50%;background:#25D366}
  .chat-header .info{flex:1}
  .chat-header .name{font-weight:600;font-size:16px}
  .chat-header .status{font-size:12px;opacity:0.9}
  .chat-body{height:calc(100vh - 140px);overflow-y:auto;padding:16px;background:#0c1317;background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==');opacity:0.06}
  .msg{display:flex;margin-bottom:12px}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:75%;padding:8px 12px;border-radius:8px;font-size:15px;line-height:1.4;position:relative;word-wrap:break-word}
  .msg.bot .bubble{background:#202c33;color:#e9edef;border-top-left-radius:2px}
  .msg.user .bubble{background:#005c4b;color:#e9edef;border-top-right-radius:2px}
  .chat-input{background:#1f2c33;padding:8px 16px;display:flex;gap:8px;align-items:center;position:sticky;bottom:0}
  .chat-input input{flex:1;background:#2a3942;border:none;border-radius:25px;padding:12px 20px;color:#e9edef;font-size:15px;outline:none}
  .send-btn{background:#00a884;border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;font-size:20px}
</style>
</head>
<body>

<!-- PAGE 1: DASHBOARD -->
<div id="dashboardPage">
  <div class="header">
    <h1>Maya<br>Didi</h1>
    <div class="header-icons"><span>☀️</span><span>🔥 11</span><span>❤️ 1</span><span>⚡ 340</span><span>🌙</span></div>
  </div>
  <div class="container">
    <button onclick="openChat()" class="btn btn-purple">💬 Maya se Gupshup Karo</button>
    <a href="/wrong-questions.html" class="btn btn-red">❌ wrong Questions practice karo</a>
    <a href="/sun-ke-jodo.html" class="btn btn-orange">🎧🎤 Sun Ke Jodo Game</a>
    <a href="/bol-ke-practice.html" class="btn btn-green">🎤 Bol ke Practice Karo</a>
  </div>
</div>

<!-- PAGE 2: WHATSAPP CHAT - Shuru me hidden rahega -->
<div id="chatPage" class="hidden">
  <div class="chat-header">
    <div onclick="backToDashboard()" style="cursor:pointer;font-size:24px">←</div>
    <img src="" alt="Maya">
    <div class="info">
      <div class="name">Maya Didi</div>
      <div class="status" id="status">online</div>
    </div>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="msg bot"><div class="bubble">Namaste 🙏 Main Maya Didi hu. English seekhni hai? Koi bhi sawal pucho.</div></div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const API_URL = "/api/chat";
let chatHistory = [];

function openChat(){
  document.getElementById('dashboardPage').classList.add('hidden');
  document.getElementById('chatPage').classList.remove('hidden');
}

function backToDashboard(){
  document.getElementById('chatPage').classList.add('hidden');
  document.getElementById('dashboardPage').classList.remove('hidden');
}

async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  
  addMsg(text, 'user');
  input.value = '';
  document.getElementById('status').innerText = 'typing...';
  
  chatHistory.push({role: "user", content: text});
  
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });
    const data = await res.json();
    const reply = data.reply || "Sorry, kuch gadbad ho gayi.";
    
    addMsg(reply, 'bot');
    chatHistory.push({role: "assistant", content: reply});
    document.getElementById('status').innerText = 'online';
  } catch(e){
    addMsg("Network error hai bhai.", 'bot');
    document.getElementById('status').innerText = 'online';
  }
}

function addMsg(text, sender){
  const chatBody = document.getElementById('chatBody');
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${sender}`;
  msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
  chatBody.appendChild(msgDiv);
  chatBody.scrollTop = chatBody.scrollHeight;
}
</script>

</body>
</html>
