<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya Didi Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0b141a; height: 100vh; max-width: 600px; margin: auto; overflow: hidden; color: white; }

    .chat-header { height: 60px; background: #202c33; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid #2f3b43; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: #00a884; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .user-info { display: flex; flex-direction: column; }
    .name { font-size: 16px; font-weight: 600; }
    .status { font-size: 12px; color: #8696a0; }

    .chat-box {
      height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 10px;
      background: #0b141a;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 78%;
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
      position: relative;
      animation: fadeIn 0.2s ease;
    }
    .user-msg {
      background: #005c4b;
      align-self: flex-end;
      border-top-right-radius: 0;
    }
    .ai-msg {
      background: #202c33;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .input-area {
      height: 70px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #2f3b43;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: auto;
    }
    #chat-input {
      flex: 1;
      height: 45px;
      border: none;
      border-radius: 25px;
      padding: 0 18px;
      background: #2a3942;
      color: white;
    }
    #send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">👩‍🏫</div>
      <div class="user-info">
        <div class="name">Maya Didi</div>
        <div class="status">online</div>
      </div>
    </div>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="msg ai-msg">
      Namaste 🙋‍♀️ Main Maya Didi hun. English sikhe?
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="chat-input" placeholder="Type a message">
    <button id="send-btn">➤</button>
  </div>

  <script>
    const input = document.getElementById('chat-input');
    const chatBox = document.getElementById('chat-box');

    document.getElementById('send-btn').onclick = sendMsg;
    input.addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

    async function sendMsg() {
      const msg = input.value.trim();
      if(!msg) return;

      chatBox.innerHTML += `<div class="msg user-msg">${msg}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: msg })
      });
      const data = await res.json();
      chatBox.innerHTML += `<div class="msg ai-msg">${data.reply || 'Maya busy hai 😅'}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
