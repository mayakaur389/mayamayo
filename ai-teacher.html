<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Didi Chat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:#0c1317;color:#e9edef;min-height:100vh;max-width:600px;margin:auto;display:flex;flex-direction:column}
 .chat-header{background:#075e54;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
 .chat-header img{width:40px;height:40px;border-radius:50%;object-fit:cover} /* Maya ki DP */
 .chat-header.info{flex:1}
 .chat-header.name{font-weight:600;font-size:16px;color:white}
 .chat-header.status{font-size:12px;opacity:0.9;color:#d1f4cc}
 .back-btn{cursor:pointer;font-size:24px;color:white;text-decoration:none}
 .chat-body{flex:1;overflow-y:auto;padding:16px;background:#0c1317}
 .msg{display:flex;margin-bottom:12px}
 .msg.user{justify-content:flex-end}
 .bubble{max-width:75%;padding:8px 12px;border-radius:8px;font-size:15px;line-height:1.4;position:relative;word-wrap:break-word}
 .msg.bot.bubble{background:#202c33;color:#e9edef;border-top-left-radius:2px}
 .msg.user.bubble{background:#005c4b;color:#e9edef;border-top-right-radius:2px}
 .chat-input{background:#1f2c33;padding:8px 16px;display:flex;gap:8px;align-items:center;position:sticky;bottom:0}
 .chat-input input{flex:1;background:#2a3942;border:none;border-radius:25px;padding:12px 20px;color:#e9edef;font-size:15px;outline:none}
 .chat-input input::placeholder{color:#8696a0}
 .mic-btn,.send-btn{background:#00a884;border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;font-size:20px}
 .mic-btn.recording{background:#ef4444} /* Recording me laal ho jayega */
</style>
</head>
<body>

<div class="chat-header">
  <a href="/" class="back-btn">←</a>
  <img src="https://i.ibb.co/6y1zq2g/maya-dp.png" alt="Maya Didi"> <!-- Maya ki DP -->
  <div class="info">
    <div class="name">Maya Didi</div>
    <div class="status" id="status">online</div>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <div class="msg bot">
    <div class="bubble">Namaste 🙏 Main Maya Didi hu. English seekhni hai? Koi bhi sawal pucho.</div>
  </div>
</div>

<div class="chat-input">
  <input type="text" id="userInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button> <!-- Mic Button -->
  <button class="send-btn" onclick="sendMsg()">➤</button>
</div>

<script>
const API_URL = "/api/chat";
let chatHistory = [];
let recognition;

// 1. Voice to Text - Mic wala kaam
function toggleMic(){
  const micBtn = document.getElementById('micBtn');

  if (!('webkitSpeechRecognition' in window)) {
    alert("Bhai, tumhara browser voice support nahi karta. Chrome use karo.");
    return;
  }

  if (!recognition) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'hi-IN'; // Hindi me sunega
    recognition.continuous = false;

    recognition.onstart = () => {
      micBtn.classList.add('recording');
      document.getElementById('status').innerText = 'sun rahi hu...';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById('userInput').value = transcript;
      sendMsg(); // Bolte hi bhej de
    };

    recognition.onerror = () => {
      document.getElementById('status').innerText = 'online';
    };

    recognition.onend = () => {
      micBtn.classList.remove('recording');
      document.getElementById('status').innerText = 'online';
    };
  }

  recognition.start();
}

// 2. Maya se Reply
async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, 'user');
  input.value = '';
  document.getElementById('status').innerText = 'typing...';
  chatHistory.push({role: "user", content: text});

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });

    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const reply = data.reply || "Sorry, jawab nahi mila.";
    addMsg(reply, 'bot');
    chatHistory.push({role: "assistant", content: reply});
    document.getElementById('status').innerText = 'online';

  } catch(e){
    console.error("API Error:", e);
    addMsg("Maya so rahi hai bhai 😅. `OPENROUTER_API_KEY` Vercel me check kar le.", 'bot');
    document.getElementById('status').innerText = 'online';
  }
}

function addMsg(text, sender){
  const chatBody = document.getElementById('chatBody');
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${sender}`;
  msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
  chatBody.appendChild(msgDiv);
  chatBody.scrollTop = chatBody.scrollHeight;
}
</script>
</body>
</html>
