<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya Didi - AI Teacher</title>
  <style>
    body { font-family: Arial; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
   .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #3b82f6; }
   .header h2 { margin: 0; color: #3b82f6; }
   .header p { margin: 5px 0 0; font-size: 14px; color: #94a3b8; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
   .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
   .user { background: #3b82f6; align-self: flex-end; }
   .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
   .input-area { display: flex; padding: 15px; background: #1e293b; border-top: 2px solid #334155; gap: 10px; }
    #userInput { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 16px; outline: none; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #2563eb; }
    #micBtn { background: #ef4444; }
    #micBtn.recording { background: #22c55e; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>

  <div class="header">
    <h2>👩‍🏫 Maya Didi</h2>
    <p id="status">online</p>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Maya se kuch pucho...">
    <button id="micBtn" onclick="toggleMic()">🎤</button>
    <button onclick="sendMsg()">Bhej</button>
  </div>

<script>
const API_URL = window.location.origin + "/api/chat"; // ✅ Groq API ka sahi root
let chatHistory = [];
let recognition;
let isRecording = false;

// Initial msg
addMsg("Namaste 🙏 Main Maya Didi hu. English seekhni hai? Koi bhi sawal pucho.", 'bot');

function addMsg(text, sender){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, 'user');
  input.value = '';
  document.getElementById('status').innerText = 'typing...';
  chatHistory.push({role: "user", content: text});

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });

    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const reply = data.reply || "Sorry, jawab nahi mila.";
    addMsg(reply, 'bot');
    chatHistory.push({role: "assistant", content: reply});
    document.getElementById('status').innerText = 'online';

  } catch(e){
    console.error("API Error:", e);
    addMsg("Maya so rahi hai bhai 😅. `GROQ_API_KEY` Vercel me check kar le ya API down hai.", 'bot'); // ✅ Error fix
    document.getElementById('status').innerText = 'online';
  }
}

// Enter se bhejo
document.getElementById('userInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') sendMsg();
});

// Mic wala code
function toggleMic(){
  if(!('webkitSpeechRecognition' in window)){
    alert("Mic support nahi hai bhai");
    return;
  }

  if(!recognition){
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;

    recognition.onstart = () => {
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('status').innerText = 'sun rahi hu...';
    };

    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      document.getElementById('userInput').value = text;
      sendMsg();
    };

    recognition.onend = () => {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('status').innerText = 'online';
    };
  }

  if(isRecording){
    recognition.stop();
  } else {
    recognition.start();
  }
}
</script>

</body>
</html>
