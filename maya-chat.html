<!DOCTYPE html>
<html>
<head>
    <title>Maya Didi AI Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 10px; }
        #chat-box { height: 70vh; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: white; margin-bottom: 10px; }
     .user { text-align: right; color: blue; margin: 5px; }
     .maya { text-align: left; color: green; margin: 5px; }
        #input-box { width: 75%; padding: 10px; }
        #send-btn { width: 20%; padding: 10px; background: orange; border: none; }
    </style>
</head>
<body>
    <h2>🤖 Maya Didi se Gupshup</h2>
    <div id="chat-box">
        
    </div>
    <input id="input-box" type="text" placeholder="Yaha type karo...">
    <button id="send-btn" onclick="askMaya()">Bhejo</button>

   <script>
async function askMaya() {
    const input = document.getElementById('input-box');
    const chatBox = document.getElementById('chat-box');
    const question = input.value.trim();
    
    if (!question) return; // Khali ho to return

    // User ka msg dikha
    chatBox.innerHTML += `<div class="user">You: ${question}</div>`;
    chatBox.innerHTML += `<div class="maya">Maya Didi: Soch rahi hu...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    input.value = ''; // Input khali kar de

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: question })
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'API Error: ' + res.status);
        }

        const data = await res.json();
        const reply = data.reply || data.error || "Maya Didi chup hai 😅";
        
        // "Soch rahi hu..." ko reply se replace kar de
        chatBox.innerHTML = chatBox.innerHTML.replace('Maya Didi: Soch rahi hu...', `Maya Didi: ${reply}`);
        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (err) {
        console.error(err);
        chatBox.innerHTML += `<div class="maya">Maya Error: ${err.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

// Enter dabane se bhi send ho jaye
document.getElementById('input-box').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        askMaya();
    }
});
</script>
</body>
</html>
