<!DOCTYPE html>
<html lang="en">

<head>
    <title>Maya Didi AI Chat</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#0f0f0f;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .chat-container{
            width:100%;
            max-width:420px;
            height:95vh;
            background:#1c1c1e;
            display:flex;
            flex-direction:column;
            border-radius:20px;
            overflow:hidden;
        }

        .header{
            background:#111;
            color:white;
            padding:18px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            border-bottom:1px solid #333;
        }

        #chat-box{
            flex:1;
            overflow-y:auto;
            padding:15px;
            display:flex;
            flex-direction:column;
            gap:12px;
            background:#0f0f0f;
        }

        .message{
            max-width:80%;
            padding:12px 15px;
            border-radius:16px;
            font-size:15px;
            line-height:1.5;
            word-wrap:break-word;
            direction:ltr;
            text-align:left;
        }

        .user{
            align-self:flex-end;
            background:#007aff;
            color:white;
            border-bottom-right-radius:5px;
        }

        .maya{
            align-self:flex-start;
            background:#2c2c2e;
            color:white;
            border-bottom-left-radius:5px;
        }

        .input-area{
            display:flex;
            padding:12px;
            background:#1c1c1e;
            border-top:1px solid #333;
        }

        #input-box{
            flex:1;
            padding:12px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#2c2c2e;
            color:white;
            font-size:15px;
        }

        #send-btn{
            margin-left:10px;
            padding:12px 18px;
            border:none;
            border-radius:12px;
            background:#007aff;
            color:white;
            font-size:15px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        🤖 Maya Didi
    </div>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            id="input-box"
            type="text"
            placeholder="Yaha type karo..."
        >

        <button id="send-btn" onclick="askMaya()">
            Send
        </button>

    </div>

</div>

<script>

async function askMaya(){

    const input = document.getElementById('input-box');

    const chatBox = document.getElementById('chat-box');

    const question = input.value.trim();

    if(!question) return;

    // USER MESSAGE
    const userMsg = document.createElement('div');

    userMsg.className = 'message user';

    userMsg.innerText = "You: " + question;

    chatBox.appendChild(userMsg);

    // INPUT CLEAR
    input.value = '';

    // MAYA LOADING MESSAGE
    const mayaMsg = document.createElement('div');

    mayaMsg.className = 'message maya';

    mayaMsg.innerText = "Maya Didi: Soch rahi hu...";

    chatBox.appendChild(mayaMsg);

    // AUTO SCROLL
    chatBox.scrollTop = chatBox.scrollHeight;

    try{

        const res = await fetch('/api/chat', {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                prompt:question
            })

        });

        if(!res.ok){

            const err = await res.json();

            throw new Error(
                err.error || 'API Error'
            );
        }

        const data = await res.json();

        const reply =
            data.reply ||
            data.error ||
            "Maya Didi chup hai 😅";

        // REPLACE ONLY THIS MESSAGE
        mayaMsg.innerText =
            "Maya Didi: " + reply;

    }

    catch(err){

        console.error(err);

        mayaMsg.innerText =
            "Maya Error: " + err.message;
    }

    // AUTO SCROLL
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ENTER KEY SUPPORT
document
.getElementById('input-box')
.addEventListener('keypress', function(e){

    if(e.key === 'Enter'){
        askMaya();
    }

});

</script>

</body>
</html>
