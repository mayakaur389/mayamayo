<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bol ke Practice Karo</title>
    <link rel="stylesheet" href="speaking.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button onclick="goBack()">← Back</button>
            <h2>🎤 Bol ke Practice Karo</h2>
            <button id="themeToggle">🌙 Dark</button>
        </div>
        <div class="card">
            <div id="questionCount">1 / 5</div>
            <p id="speakQuestion">I am going to market</p>
            <div class="buttons">
                <button id="listenBtn">🔊 Suno</button>
                <button id="recordBtn">🎤 Bolo</button>
            </div>
            <div id="speakResult"></div>
            <div id="speakHindi"></div>
            <button id="retryWrongBtn" style="display: none;">🔄 Galat wale practice karo</button> <!-- NEW CODE -->
        </div>
    </div>
    <script src="speaking.js"></script>
</body>
</html>
