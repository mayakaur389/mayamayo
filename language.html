<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><title>Language Select</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;padding:20px;text-align:center}
h2{color:#333}
.lang{padding:18px;margin:12px 0;background:#fff;border-radius:12px;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.lang:hover{background:#667eea;color:#fff}
</style>
 <script>
    // Guard: Agar login nahi hai to login pe bhej do
    if(localStorage.getItem("loggedIn") !== "true"){
        window.location.replace("login.html")
    } 
    // Agar login hai par language nahi chuni
    else if(!localStorage.getItem("lang")){
        window.location.replace("language.html")
    }
    // Agar dono hai to index pe bhej do
    else {
        window.location.replace("index.html")
    }
</script>
</head>
<body>
<h2>Apni Language Chuno</h2>
<div class="lang" onclick="select('hi-en')">🇮🇳 Hindi → English</div>
<div class="lang" onclick="select('en-hi')">🇬🇧 English → Hindi</div>
<div class="lang" onclick="select('es-en')">🇪🇸 Spanish → English</div>
<div class="lang" onclick="select('fr-en')">🇫🇷 French → English</div>
<div class="lang" onclick="select('ja-en')">🇯🇵 Japanese → English</div>
<div class="lang" onclick="select('de-en')">🇩🇪 German → English</div>
<script>
function select(l){
  localStorage.setItem("lang",l);
window.location.href = "/index.html?nocache=1";
}
</script>
</body>
</html>
