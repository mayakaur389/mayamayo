<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galat Questions Practice</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:24px}
.btn-back{background:#334155;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab-btn{background:#1e293b;border:none;color:#94a3b8;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600}
.tab-btn.active{background:#3b82f6;color:#fff}
.question-card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:15px}
.tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:8px}
.tag-day{background:#22c55e}.tag-speak{background:#f97316}.tag-listen{background:#8b5cf6}
.big-btn{background:#22c55e;border:none;color:#fff;padding:14px;width:100%;border-radius:10px;margin:15px 0;font-weight:800;font-size:16px;cursor:pointer}
.big-btn:disabled{background:#475569;cursor:not-allowed}
.section-box{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:20px}
.count-text{font-size:14px;color:#94a3b8;margin:5px 0 10px 0}
.empty{text-align:center;padding:40px;color:#94a3b8}
.tabs{overflow-x: auto;} .tab-btn{flex-shrink: 0;} .tabs::-webkit-scrollbar { display: none; }
.header{background: transparent;padding: 10px 0;}
</style>
</head>
<body>

<div class="header">
  <h1>❌ Galat Sawaal Dobara Sikho</h1>
  <button class="btn-back" onclick="window.location.href='index.html'">⬅ Wapas Jao</button>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0">
  <p id="total_text" style="margin:0">Total: 0 galat questions hain</p>
  <button onclick="clearAll()" style="background:#ef4444;border:none;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer">🗑️ Sab Clear Karo</button>
</div>

<div class="section-box">
  <div class="tabs"><button class="tab-btn">📖 Lessons</button></div>
  <p class="count-text">Galat: <span id="lesson-count">0</span> questions</p>
  <button class="big-btn" id="btn_lessons_practice">🔥 Lessons Ke Galat Practice Karo</button>
</div>

<div class="section-box">
  <div class="tabs"><button class="tab-btn active">🎙️ Bol Ke Practice</button></div>
  <p class="count-text">Galat: <span id="speak-count">0</span> questions</p>
  <button class="big-btn" id="btn_speaking_practice">🔥 Bol Ke Galat Practice Karo</button>
</div>

<div class="section-box">
  <div class="tabs"><button class="tab-btn">👂 Suno</button></div>
  <p class="count-text">Galat: <span id="game-count">0</span> questions</p>
  <button class="big-btn" id="btn_listening_practice">🔥 Suno Wale Galat Practice Karo</button>
</div>

<div id="wrong-list"></div>
<p id="no_question_text" class="empty">🔇 Koi galat question nahi hai abhi</p>

<script>
function getAll(){ try{ return JSON.parse(localStorage.getItem('wrongQuestions')||'[]'); }catch(e){ return []; } }

function startPractice(type){
  let all = getAll();
  console.log("TOTAL WRONG:", all);
  if(all.length===0){ alert("Ek bhi galat question save nahi hai guru! Pehle koi lesson me galat jawab do."); return; }

  // Type ka tension khatam - jo hai sab bhej do
  let filtered = all;

  // Koshish karo filter karne ki, nahi hua to sab bhej do
  if(type==='lesson'){
    let f = all.filter(q=>{ let t=(q.type||'').toLowerCase(); return t.includes('lesson')||t.includes('grammar')||t.includes('day')||t.includes('fill'); });
    if(f.length>0) filtered=f;
  }
  if(type==='listening'){
    let f = all.filter(q=>{ let t=(q.type||'').toLowerCase(); return t.includes('listen')||t.includes('suno')||t.includes('jodo'); });
    if(f.length>0) filtered=f;
  }
  if(type==='speaking'){
    let f = all.filter(q=>{ let t=(q.type||'').toLowerCase(); return t.includes('speak')||t.includes('bol'); });
    if(f.length>0) filtered=f;
  }

  localStorage.setItem('practiceNowSet', JSON.stringify(filtered));
  console.log("practiceNowSet:", filtered);

  if(type==='lesson') location.href='wrong-lesson-game.html';
  else if(type==='listening') location.href='wrong-suno-game.html';
  else location.href='wrong-bol-game.html';
}

function clearAll(){ if(confirm("Sab clear karna hai?")){ localStorage.removeItem('wrongQuestions'); localStorage.removeItem('practiceNowSet'); location.reload(); } }

document.getElementById('btn_lessons_practice').onclick = ()=> startPractice('lesson');
document.getElementById('btn_listening_practice').onclick = ()=> startPractice('listening');
document.getElementById('btn_speaking_practice').onclick = ()=> startPractice('speaking');

// Counts
let all=getAll();
document.getElementById('total_text').innerText=`Total: ${all.length} galat questions hain`;
document.getElementById('lesson-count').innerText=all.length;
document.getElementById('speak-count').innerText=all.length;
document.getElementById('game-count').innerText=all.length;
document.getElementById('no_question_text').style.display = all.length===0 ? 'block' : 'none';

document.getElementById('btn_lessons_practice').disabled = all.length===0;
document.getElementById('btn_listening_practice').disabled = all.length===0;
document.getElementById('btn_speaking_practice').disabled = all.length===0;
</script>
</body>
</html>
