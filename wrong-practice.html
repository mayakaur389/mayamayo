<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Questions Practice</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: white; font-family: Arial; padding: 20px; }
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap:wrap; }
      .back-btn { background: #334155; border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 18px; cursor: pointer; }
      .question-card { background: #1e293b; padding: 16px; border-radius: 12px; margin: 12px 0; border-left: 4px solid #ff4b4b; }
      .tag { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
      .tag-day { background: #3b82f6; }
      .tag-listen { background: #f97316; }
      .tag-speak { background: #22c55e; }
      .practice-btn { width: 100%; padding: 12px; margin-top: 10px; background: #ff4b4b; border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; }
      .empty { text-align: center; color: #94a3b8; margin-top: 50px; }
      .filter-tabs{display:flex; gap:8px; margin:15px 0; overflow-x:auto; padding-bottom:5px;}
      .tab-btn{padding:10px 14px; font-size:13px; border:none; border-radius:12px; background:#334155; color:#fff; cursor:pointer;}
      .tab-btn.active{background:#22c55e; color:white; box-shadow:0 0 10px #22c55e;}
      .lang-select{padding:8px; border-radius:8px; background:#334155; color:white; border:none; margin-left:auto;}
  </style>
</head>
<body>
    <div class="header">
        <button id="btn_back" class="back-btn" onclick="window.location.href='index.html'"></button>
        <h2 id="heading">❌ Galat Questions</h2>
        <select id="langSelect" class="lang-select">
            <option value="hindi_en">🇮🇳 Hindi → English</option>
            <option value="spanish_en">🇪🇸 Spanish → English</option>
            <option value="french_en">🇫🇷 French → English</option>
            <option value="japanese_en">🇯🇵 Japanese → English</option>
            <option value="german_en">🇩🇪 German → English</option>
            <option value="portuguese_en">🇵🇹 Portuguese → English</option>
            <option value="en_hindi">🇬🇧 English → Hindi</option>
        </select>
    </div>
    <div class="filter-tabs">
        <button class="tab-btn" id="btn_lessons">📖 Lessons</button>
        <button id="btn_speaking" class="tab-btn active">🗣️ Bol Ke Practice</button>
        <button id="btn_listening" class="tab-btn">👂 Sun Ke Jodo</button>
     </div>
    <p id="total_text" style="color: #94a3b8"></p>
    <div id="wrong-list"></div>
    <p id="no_question_text" class="empty"></p>

    <!-- ORDER IMPORTANT -->
    <script src="words.js"></script>
    <script src="lang.js"></script>
    <script src="wrong-practice.js"></script>
</body>
</html>
